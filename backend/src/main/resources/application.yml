spring:
  application:
    name: dynamic-data-dashboard

  datasource:
    # Override DB_URL when PostgreSQL is not running on localhost:5432.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dashboard_db}
    username: ${DB_USERNAME:postgres}
    # Keep credentials outside Git. Set DB_PASSWORD in your IntelliJ run configuration.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Suitable for local development. Use a managed migration strategy for production.
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

# JwtService expects a Base64-encoded key with at least 256 bits of key material.
# Set JWT_SECRET in IntelliJ; do not commit the secret itself.
jwt:
  secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8080}